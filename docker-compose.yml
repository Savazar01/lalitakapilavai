services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lalitakapilavai_web
    restart: unless-stopped
    ports:
      - "3060:3060"
    environment:
      - NODE_ENV=production
      - PORT=3060
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lalitakapilavai_prod}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3060}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3060}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3060}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lalitakapilavai_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3060/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: pgvector/pgvector:pg17
    container_name: lalitakapilavai_db
    restart: unless-stopped
    ports:
      - "5633:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lalitakapilavai_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    networks:
      - lalitakapilavai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lalitakapilavai_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  lalitakapilavai_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
