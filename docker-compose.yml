services:
  db:
    image: pgvector/pgvector:pg17
    container_name: lalita_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lalitakapilavai_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lalitakapilavai_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lalita_web_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3060"
    environment:
      NODE_ENV: production
      PORT: 3060
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@lalita_postgres_prod:5432/${POSTGRES_DB:-lalitakapilavai_prod}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Lalita Kapilavai Superadmin}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN}
      S3_REGION: ${S3_REGION:-auto}
      WATERMARK_TEXT: ${WATERMARK_TEXT:-© Lalita Kapilavai | lalitakapilavai.com}
      WATERMARK_OPACITY: ${WATERMARK_OPACITY:-0.75}
    volumes:
      - media_uploads:/app/public/media
    networks:
      - coolify

volumes:
  postgres_prod_data:
    name: lalita_postgres_prod_data
  media_uploads:
    name: lalita_media_uploads

networks:
  coolify:
    external: true
